<body>
    <script>
        //dairenin alanı çevresi
        //önce değişkeni tanımlayyalım
        var r,alan,cevre,pi=3.14;
        //yarıçapı alalaım
        r=Number(prompt("yaricap:"));
        //alan ve çevre hessbı
        alan=p*r*r;
        cevre=2*pi*r;
        //işlem sonucunu ekrana yazalım
        alert ("alan:"+alan+"cevre:"+cevre);
    </script>
</body>
