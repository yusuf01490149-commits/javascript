<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("sayfanın adresi: "+document.URL+"<br>");

         document.write("gelinen sayfa: "+document.referrer+"<br>");

          document.write("sayfanın genişliği: "+document.documentElement.clientWidth+"<br>");

           document.write("sayfanın başlıği: "+document.title+"<br>");
           
            document.write("sayfanın yuksekliği: "+document.documentElement.clientHeight+"<br>");
    </script>
</body>
</html>
